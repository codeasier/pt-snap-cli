# ============================================================
# 标签与模板映射
# ============================================================
# 每个模板文件的 `labels` 字段定义了创建 Issue 时自动分配的标签
#
# | 模板文件           | 自动标签          | 说明           |
# |--------------------|-------------------|----------------|
# | 01-bug-report.yml     | bug             | 错误报告       |
# | 02-feature-request.yml | enhancement    | 功能请求       |
# | 03-documentation.yml  | documentation   | 文档问题       |
# | 04-question.yml       | question        | 问题咨询       |
#
# 如需添加更多标签，编辑对应模板文件的 `labels:` 字段
# 示例：labels: ["bug", "critical", "help-wanted"]
# ============================================================
