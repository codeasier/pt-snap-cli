name: Platform compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Non-slow (${{ matrix.os }}, Python 3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-latest, macos-latest]
    env:
      # Keep multilingual source/fixture text and subprocess output deterministic.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies and console launcher
        run: python -m pip install -e ".[dev]"
      - name: Verify executable fixture provenance before collection
        run: python -m pytest tests/test_fixture_provenance.py
      - name: Run complete non-slow suite
        # No coverage denominator or scale matrix here. Resource-warning gates
        # remain enabled; required Chromium interaction runs in the Linux job.
        run: python -m pytest -m "not slow" --junitxml=platform-tests.xml -o junit_family=legacy
      - name: Upload platform test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-tests-${{ matrix.os }}-py313
          path: platform-tests.xml
          if-no-files-found: warn
          retention-days: 7
