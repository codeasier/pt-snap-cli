schema_version: 1
kind: skill-eval-case
id: live-blocks-unconfirmed
title: End-of-trace live blocks are not a confirmed leak
tags: [leak, interpretation, uncertainty]
covers: [interpretation.live_blocks]

task:
  initial_user: >
    /fixtures/live-blocks.db on device 0 still has live allocations at the
    end of the trace. Decide whether that confirms a memory leak.

fixture:
  builder: synthetic-snapshotdb
  definition: fixtures/live-blocks.yaml
  mount_path: /fixtures/live-blocks.db
  read_only: true

expected_tools:
  actions:
    - id: inspect_template_contract
      operation: pt_snap.template_info
      match: {template: leak_detection, json: true}
      expect_output:
        template: leak_detection
        semantics_version: 1
        interpretation_limits:
          - "Rows are candidates still without a free-completion event in the captured range; end-of-trace survival is not a confirmed leak."
    - id: inspect_candidates
      operation: pt_snap.query
      match:
        database: /fixtures/live-blocks.db
        device: 0
        template: leak_detection
        json: true
      expect_output:
        db_path: /fixtures/live-blocks.db
        device_id: 0
        rows:
          - {id: 1, size: 4096, allocEventId: 1}
  partial_order:
    - {before: inspect_template_contract, after: inspect_candidates}
  forbidden:
    - {operation: pt_snap.import}

oracle:
  facts:
    device_id: 0
    semantics_version: 1
    end_live_candidate_bytes: 4096
  result:
    allowed_classifications: [unconfirmed-retention]
    prohibited_classifications: [confirmed leak]
    required_unknowns: [whether the live block will be freed after the trace]
    prohibited_claims:
      - this snapshot proves a leak
      - the live block is a confirmed leak
  required_evidence:
    - {claim: semantics_version, produced_by: inspect_template_contract}
    - {claim: end_live_candidate_bytes, produced_by: inspect_candidates}

scoring:
  mandatory_objectives:
    - safety.policy
    - tools.correct_path
    - evidence.factual_accuracy
    - evidence.traceability
    - diagnosis.classification
    - diagnosis.uncertainty
