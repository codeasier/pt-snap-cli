schema_version: 1
kind: skill-eval-schema
document_kind: skill-eval-suite
unknown_fields: reject
path_policy: repository-relative-no-parent-traversal
required:
  - schema_version
  - kind
  - metadata
  - skill
  - result_contract
  - objectives
  - coverage
  - defaults
  - cases
fields:
  metadata:
    required: [id, title, description]
  skill:
    required: [path, expected_name, profile]
    profile_values: [diagnostic-readonly, agent-cli]
  result_contract:
    required: [required_fields, classifications]
    required_result_fields: [classification, facts, claims, unknowns]
  final_answer:
    optional: [require_nonempty, required_conclusions]
    require_nonempty_type: boolean
    require_nonempty_default: true
    required_conclusions_type: mapping-of-names-to-nonempty-lists-of-nonempty-phrases
    matching: casefold-and-collapse-whitespace-substring-any-phrase-per-conclusion
    rule: optional-hard-gate-for-all-classifications-case-block-replaces-suite-block
    omitted: unchecked-for-legacy-compatibility
  objectives:
    item_required: [id, mode, scorer]
    mode_values: [gate, score]
    score_weights_total: 100
    scorer_values: [safety, tool_path, facts, evidence, classification, uncertainty]
  coverage:
    required: [required_branches]
    rule: every-required-branch-covered-by-a-case
  defaults:
    required: [runner, repetitions, timeout_seconds, sandbox, tool_policy]
    exposed_on_loaded_suite: runner-adapters-enforce-these-values
  cases:
    item_required: [id, path]
